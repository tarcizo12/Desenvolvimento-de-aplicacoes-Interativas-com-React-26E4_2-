services:
  mysql-dev:
    image: mysql:8.4
    container_name: inventory-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./mysql/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-prod:
    image: mysql:8.4
    container_name: inventory-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_prod
    ports:
      - "3307:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./mysql/init-prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_prod"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: inventory-api
    restart: unless-stopped
    depends_on:
      mysql-dev:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql-dev:3306/estoque_principal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: estoque_dev
      DB_PASSWORD: estoque_dev
      JPA_DDL_AUTO: none
    ports:
      - "8080:8080"

volumes:
  mysql-dev-data:
  mysql-prod-data:

services:
  mysql-dev:
    image: mysql:8.4
    container_name: estoque-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./mysql/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mysql-prod:
    image: mysql:8.4
    container_name: estoque-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_prod
    ports:
      - "3307:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./mysql/init-prod.sql:/docker-entrypoint-initdb.d/init.sql:ro

  rabbitmq:
    build: ./rabbitmq
    container_name: estoque-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"

  aplicacao-principal:
    build: ./aplicacao-principal
    container_name: estoque-aplicacao-principal
    restart: unless-stopped
    depends_on:
      - mysql-dev
      - rabbitmq
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql-dev:3306/estoque_principal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root_dev
      JPA_DDL_AUTO: none
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  mysql-dev-data:
  mysql-prod-data: